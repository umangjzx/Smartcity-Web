<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Constellation dots -->
  <circle cx="60" cy="80" r="4" fill="#FBFAFF" opacity="0.9"/>
  <circle cx="120" cy="140" r="3" fill="#FBFAFF" opacity="0.8"/>
  <circle cx="200" cy="100" r="5" fill="#F6B51B" opacity="0.9"/>
  <circle cx="280" cy="160" r="3.5" fill="#FBFAFF" opacity="0.85"/>
  <circle cx="340" cy="80" r="4" fill="#FBFAFF" opacity="0.9"/>
  <circle cx="160" cy="240" r="3" fill="#FBFAFF" opacity="0.7"/>
  <circle cx="240" cy="280" r="4.5" fill="#F6B51B" opacity="0.8"/>
  <circle cx="320" cy="300" r="3" fill="#FBFAFF" opacity="0.75"/>
  <circle cx="80" cy="320" r="3.5" fill="#FBFAFF" opacity="0.8"/>
  <circle cx="360" cy="220" r="3" fill="#FBFAFF" opacity="0.7"/>
  <!-- Constellation lines -->
  <line x1="60" y1="80" x2="120" y2="140" stroke="#FBFAFF" stroke-width="0.5" opacity="0.25"/>
  <line x1="120" y1="140" x2="200" y2="100" stroke="#FBFAFF" stroke-width="0.5" opacity="0.25"/>
  <line x1="200" y1="100" x2="280" y2="160" stroke="#FBFAFF" stroke-width="0.5" opacity="0.25"/>
  <line x1="280" y1="160" x2="340" y2="80" stroke="#FBFAFF" stroke-width="0.5" opacity="0.25"/>
  <line x1="200" y1="100" x2="160" y2="240" stroke="#FBFAFF" stroke-width="0.5" opacity="0.2"/>
  <line x1="160" y1="240" x2="240" y2="280" stroke="#FBFAFF" stroke-width="0.5" opacity="0.2"/>
  <line x1="240" y1="280" x2="320" y2="300" stroke="#FBFAFF" stroke-width="0.5" opacity="0.2"/>
  <line x1="280" y1="160" x2="360" y2="220" stroke="#FBFAFF" stroke-width="0.5" opacity="0.2"/>
  <line x1="160" y1="240" x2="80" y2="320" stroke="#FBFAFF" stroke-width="0.5" opacity="0.2"/>
  <!-- Small glow on key stars -->
  <radialGradient id="starGlow">
    <stop offset="0%" stop-color="#F6B51B" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#F6B51B" stop-opacity="0"/>
  </radialGradient>
  <circle cx="200" cy="100" r="20" fill="url(#starGlow)"/>
  <circle cx="240" cy="280" r="16" fill="url(#starGlow)"/>
</svg>
